<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="900" height="2" fill="#38bdf8" fill-opacity="0.15"/>
  <rect x="0" y="2" width="300" height="4" rx="2" fill="url(#line)">
    <animate attributeName="x" values="-300;900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
