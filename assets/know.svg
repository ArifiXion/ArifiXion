<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-label="Know about me. Aiman, Rekayasa Perangkat Lunak. 1 year 6 months of coding, 15 tech and tools.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1010"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4444" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4444" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff4444" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="box"><rect x="6" y="6" width="588" height="158" rx="18"/></clipPath>
  </defs>

  <rect x="6" y="6" width="588" height="158" rx="18" fill="url(#card)" stroke="#ff4444" stroke-opacity="0.4" stroke-width="2"/>

  <g clip-path="url(#box)">
    <g stroke="#ff4444" stroke-opacity="0.06">
      <path d="M0 45H600M0 85H600M0 125H600"/>
      <path d="M100 0V170M200 0V170M300 0V170M400 0V170M500 0V170"/>
    </g>
    <rect x="-200" y="6" width="200" height="158" fill="url(#beam)">
      <animate attributeName="x" from="-200" to="600" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="6" y="6" width="588" height="158" rx="18" fill="none" stroke="#ff4444" stroke-width="3" stroke-dasharray="140 1000" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-1480" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- avatar -->
  <g transform="translate(86 85)">
    <circle r="60" fill="url(#halo)">
      <animate attributeName="r" values="52;62;52" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" fill="none" stroke="#ff4444" stroke-opacity="0.5" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="42" fill="#1c1010" stroke="#ff4444" stroke-opacity="0.5" stroke-width="3"/>
    <circle r="42" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="60 400" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text y="17" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">A</text>
  </g>

  <g font-family="Consolas, Menlo, monospace">
    <text x="168" y="70" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="2">KNOW ABOUT ME</text>
    <rect x="168" y="80" width="60" height="3" rx="2" fill="#ff4444">
      <animate attributeName="width" values="40;180;40" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="168" y="108" font-size="15" fill="#ff6b6b">Aiman · Rekayasa Perangkat Lunak</text>

    <rect x="168" y="120" width="160" height="28" rx="14" fill="#1c1010" stroke="#ff4444" stroke-opacity="0.6"/>
    <text x="248" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1 YR 6 MO CODING</text>
    <rect x="338" y="120" width="150" height="28" rx="14" fill="#1c1010" stroke="#ff4444" stroke-opacity="0.6"/>
    <text x="413" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">15 TECH &amp; TOOLS</text>
  </g>
</svg>
