<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="Profile visitors radar. Every visit adds one to the total below.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-45" y2="-54">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="screen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <clipPath id="box"><rect x="6" y="6" width="588" height="178" rx="18"/></clipPath>
  </defs>

  <rect x="6" y="6" width="588" height="178" rx="18" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>

  <g clip-path="url(#box)">
    <g stroke="#38bdf8" stroke-opacity="0.07">
      <path d="M0 50H600M0 95H600M0 140H600"/>
      <path d="M100 0V190M200 0V190M300 0V190M400 0V190M500 0V190"/>
    </g>
  </g>

  <rect x="6" y="6" width="588" height="178" rx="18" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="140 1000" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-1560" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- radar -->
  <g transform="translate(115 95)">
    <circle r="72" fill="url(#screen)" stroke="#38bdf8" stroke-width="2"/>
    <g fill="none" stroke="#38bdf8" stroke-opacity="0.35">
      <circle r="48"/>
      <circle r="24"/>
      <path d="M-72 0H72M0 -72V72"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <path d="M0 0 L0 -72 A72 72 0 0 0 -46 -55 Z" fill="url(#sweep)"/>
      <path d="M0 0 L0 -72" stroke="#7dd3fc" stroke-width="2"/>
    </g>

    <!-- visitor blips: appear when the sweep passes, then fade -->
    <g fill="#ffffff" opacity="0">
      <circle cx="30" cy="-36" r="4"><animate attributeName="opacity" values="1;0" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ffffff" opacity="0">
      <circle cx="48" cy="22" r="3.5"><animate attributeName="opacity" values="1;0" dur="4s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ffffff" opacity="0">
      <circle cx="-12" cy="50" r="4.5"><animate attributeName="opacity" values="1;0" dur="4s" begin="2.2s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ffffff" opacity="0">
      <circle cx="-40" cy="-6" r="3.5"><animate attributeName="opacity" values="1;0" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ffffff" opacity="0">
      <circle cx="-22" cy="-44" r="3"><animate attributeName="opacity" values="1;0" dur="4s" begin="3.55s" repeatCount="indefinite"/></circle>
    </g>

    <circle r="4" fill="#38bdf8"/>
  </g>

  <!-- text -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="228" y="34" width="86" height="26" rx="13" fill="#0b1c2e" stroke="#7dd3fc" stroke-opacity="0.6"/>
    <circle cx="246" cy="47" r="5" fill="#7dd3fc"/>
    <circle cx="246" cy="47" r="5" fill="none" stroke="#7dd3fc" stroke-width="2">
      <animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="52" font-size="14" font-weight="800" fill="#7dd3fc" letter-spacing="2">LIVE</text>

    <text x="228" y="102" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="2">PROFILE VISITORS</text>
    <text x="228" y="132" font-size="16" fill="#7dd3fc" letter-spacing="1">Every visit adds +1 to the total</text>
    <text x="228" y="162" font-size="16" fill="#a3b4c9" letter-spacing="1">
      TOTAL
      <tspan fill="#38bdf8" font-weight="800">
        ▾
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </tspan>
    </text>
  </g>
</svg>
