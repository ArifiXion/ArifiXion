<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="Profile visitors. Every visit adds one to the total below.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1010"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="globe" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#5a1414"/>
      <stop offset="55%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#0d0709"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4444" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4444" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff4444" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="box"><rect x="6" y="6" width="588" height="178" rx="18"/></clipPath>
    <clipPath id="ball"><circle cx="115" cy="95" r="66"/></clipPath>
  </defs>

  <rect x="6" y="6" width="588" height="178" rx="18" fill="url(#card)" stroke="#ff4444" stroke-opacity="0.4" stroke-width="2"/>

  <g clip-path="url(#box)">
    <g stroke="#ff4444" stroke-opacity="0.06">
      <path d="M0 50H600M0 95H600M0 140H600"/>
      <path d="M100 0V190M200 0V190M300 0V190M400 0V190M500 0V190"/>
    </g>
    <rect x="-200" y="6" width="200" height="178" fill="url(#beam)">
      <animate attributeName="x" from="-200" to="600" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="6" y="6" width="588" height="178" rx="18" fill="none" stroke="#ff4444" stroke-width="3" stroke-dasharray="140 1000" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-1560" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- globe -->
  <circle cx="115" cy="95" r="86" fill="url(#halo)">
    <animate attributeName="r" values="80;90;80" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g>
    <!-- back half of the orbit ring -->
    <g transform="rotate(-24 115 95)">
      <ellipse cx="115" cy="95" rx="92" ry="22" fill="none" stroke="#ff4444" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 6"/>
    </g>

    <circle cx="115" cy="95" r="66" fill="url(#globe)"/>

    <g clip-path="url(#ball)" fill="none" stroke="#ff4444" stroke-width="1.2">
      <!-- latitudes -->
      <g stroke-opacity="0.28">
        <ellipse cx="115" cy="95" rx="66" ry="13"/>
        <ellipse cx="115" cy="73" rx="62" ry="12"/>
        <ellipse cx="115" cy="51" rx="49" ry="9"/>
        <ellipse cx="115" cy="117" rx="62" ry="12"/>
        <ellipse cx="115" cy="139" rx="49" ry="9"/>
      </g>
      <!-- rotating meridians -->
      <g stroke-opacity="0.55">
        <ellipse cx="115" cy="95" ry="66" rx="66">
          <animate attributeName="rx" values="66;61;47;25;0;25;47;61;66" dur="8s" begin="0s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="115" cy="95" ry="66" rx="66">
          <animate attributeName="rx" values="66;61;47;25;0;25;47;61;66" dur="8s" begin="-2s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="115" cy="95" ry="66" rx="66">
          <animate attributeName="rx" values="66;61;47;25;0;25;47;61;66" dur="8s" begin="-4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="115" cy="95" ry="66" rx="66">
          <animate attributeName="rx" values="66;61;47;25;0;25;47;61;66" dur="8s" begin="-6s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>

    <!-- visitor pings -->
    <g fill="#ffffff">
      <circle cx="92" cy="72" r="3"/>
      <circle cx="92" cy="72" r="3" fill="none" stroke="#ff6b6b" stroke-width="1.5">
        <animate attributeName="r" values="3;16" dur="3s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="88" r="3"/>
      <circle cx="140" cy="88" r="3" fill="none" stroke="#ff6b6b" stroke-width="1.5">
        <animate attributeName="r" values="3;16" dur="3s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="3s" begin="-1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="108" cy="122" r="3"/>
      <circle cx="108" cy="122" r="3" fill="none" stroke="#ff6b6b" stroke-width="1.5">
        <animate attributeName="r" values="3;16" dur="3s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="3s" begin="-2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="115" cy="95" r="66" fill="none" stroke="#ff4444" stroke-width="2.5"/>

    <!-- front half of the orbit ring + travelling satellite -->
    <g transform="rotate(-24 115 95)">
      <path d="M23 95 A92 22 0 0 0 207 95" fill="none" stroke="#ff4444" stroke-opacity="0.75" stroke-width="2"/>
      <circle r="5" fill="#ffffff">
        <animateMotion dur="5s" repeatCount="indefinite" path="M207 95 A92 22 0 1 1 23 95 A92 22 0 1 1 207 95"/>
      </circle>
    </g>
  </g>

  <!-- text -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="228" y="34" width="86" height="26" rx="13" fill="#1c1010" stroke="#ff4444" stroke-opacity="0.6"/>
    <circle cx="246" cy="47" r="5" fill="#ff4444"/>
    <circle cx="246" cy="47" r="5" fill="none" stroke="#ff4444" stroke-width="2">
      <animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="52" font-size="14" font-weight="800" fill="#ff4444" letter-spacing="2">LIVE</text>

    <text x="228" y="102" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="2">PROFILE VISITORS</text>
    <text x="228" y="132" font-size="16" fill="#ff6b6b" letter-spacing="1">Every visit adds +1 to the total</text>
    <text x="228" y="162" font-size="16" fill="#9da7b3" letter-spacing="1">
      TOTAL
      <tspan fill="#ff4444" font-weight="800">
        ▾
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </tspan>
    </text>
  </g>
</svg>
