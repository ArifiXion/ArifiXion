<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-label="Ship small, learn in public, useful over flashy" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="box"><rect width="900" height="44" rx="8"/></clipPath>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#box)">
    <rect width="900" height="44" fill="#0d1117"/>
    <rect width="900" height="44" fill="#8b0000" fill-opacity="0.18"/>
    <g font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#ff4444" letter-spacing="3">
      <g>
        <text x="0" y="28" textLength="900" lengthAdjust="spacing">SHIP SMALL ✦ LEARN IN PUBLIC ✦ USEFUL &gt; FLASHY ✦ BUILD THINGS ✦</text>
        <text x="900" y="28" textLength="900" lengthAdjust="spacing">SHIP SMALL ✦ LEARN IN PUBLIC ✦ USEFUL &gt; FLASHY ✦ BUILD THINGS ✦</text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="22s" repeatCount="indefinite"/>
      </g>
    </g>
    <rect width="70" height="44" fill="url(#fadeL)"/>
    <rect x="830" width="70" height="44" fill="url(#fadeR)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="43" rx="8" fill="none" stroke="#ff4444" stroke-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
