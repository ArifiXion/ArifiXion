<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="ArifiXion - Frontend and Full-Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#2a0606;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5a0b0b">
        <animate attributeName="stop-color" values="#5a0b0b;#0d1117;#5a0b0b" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="900" height="240" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="240" fill="url(#bg)"/>

    <circle cx="120" cy="60" r="110" fill="url(#glow)">
      <animate attributeName="cx" values="120;220;120" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;100;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="190" r="130" fill="url(#glow)">
      <animate attributeName="cx" values="780;680;780" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;140;190" dur="11s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#ff4444" stroke-opacity="0.12">
      <path d="M0 60H900M0 120H900M0 180H900"/>
      <path d="M150 0V240M300 0V240M450 0V240M600 0V240M750 0V240"/>
    </g>

    <text x="450" y="46" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#ff4444" letter-spacing="6">&lt;/&gt; WELCOME TO MY PROFILE</text>

    <text x="450" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#title)" opacity="0">
      ArifiXion
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animate attributeName="y" from="145" to="125" dur="1.2s" fill="freeze"/>
    </text>

    <g font-family="Consolas, Menlo, monospace" font-size="20" fill="#c9d1d9" text-anchor="middle">
      <text x="450" y="172" opacity="1">Frontend &amp; Full-Stack Engineer
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.66;0.8;0.95;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="172" opacity="0">Building useful things
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.62;0.68;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="172" opacity="0">Learning in public
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.94;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="400" y="198" width="100" height="3" rx="2" fill="#ff4444">
      <animate attributeName="width" values="40;180;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x" values="430;360;430" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="898" height="238" rx="17" fill="none" stroke="#ff4444" stroke-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
