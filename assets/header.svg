<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="ArifiXion - Frontend and Full-Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#2a0606;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5a0b0b">
        <animate attributeName="stop-color" values="#5a0b0b;#0d1117;#5a0b0b" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffb3b3"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4444" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4444" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4444" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <circle cx="120" cy="60" r="120" fill="url(#glow)">
      <animate attributeName="cx" values="120;240;120" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="200" r="140" fill="url(#glow)">
      <animate attributeName="cx" values="790;670;790" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;150;200" dur="11s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#ff4444" stroke-opacity="0.10">
      <path d="M0 65H900M0 130H900M0 195H900"/>
      <path d="M150 0V260M300 0V260M450 0V260M600 0V260M750 0V260"/>
    </g>

    <g fill="#ff4444">
      <circle cx="60" r="2"><animate attributeName="cy" from="270" to="-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="140" r="3"><animate attributeName="cy" from="270" to="-10" dur="9s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="230" r="2"><animate attributeName="cy" from="270" to="-10" dur="6s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="330" r="2.5"><animate attributeName="cy" from="270" to="-10" dur="8s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="420" r="2"><animate attributeName="cy" from="270" to="-10" dur="10s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="510" r="3"><animate attributeName="cy" from="270" to="-10" dur="7.5s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="600" r="2"><animate attributeName="cy" from="270" to="-10" dur="6.5s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="690" r="2.5"><animate attributeName="cy" from="270" to="-10" dur="9.5s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9.5s" begin="-7s" repeatCount="indefinite"/></circle>
      <circle cx="770" r="2"><animate attributeName="cy" from="270" to="-10" dur="8s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <circle cx="850" r="3"><animate attributeName="cy" from="270" to="-10" dur="7s" begin="-5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="-5.5s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="260" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <text x="450" y="52" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#ff4444" letter-spacing="6">&lt;/&gt; WELCOME TO MY PROFILE</text>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" text-anchor="middle">
      <text x="450" y="142" fill="#ff4444" opacity="0">ArifiXion
        <animate attributeName="opacity" values="0;0;0.85;0;0.85;0;0" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="x" values="450;450;443;457;446;450;450" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="142" fill="#00e5ff" opacity="0">ArifiXion
        <animate attributeName="opacity" values="0;0;0.7;0;0.7;0;0" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="x" values="450;450;457;443;454;450;450" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="142" fill="url(#title)">ArifiXion</text>
    </g>

    <g font-family="Consolas, Menlo, monospace" font-size="22" fill="#c9d1d9" text-anchor="middle">
      <text x="450" y="192" opacity="1">Frontend &amp; Full-Stack Engineer
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.66;0.8;0.95;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="192" opacity="0">Building useful things
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.62;0.68;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="192" opacity="0">Learning in public
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.94;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="400" y="216" width="100" height="3" rx="2" fill="#ff4444">
      <animate attributeName="width" values="40;200;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x" values="430;350;430" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#ff4444" stroke-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
      
