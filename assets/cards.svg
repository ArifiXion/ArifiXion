<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Principles: ship small, care about UI, stay readable">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1010"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="10" y="10" width="580" height="110" rx="16" fill="url(#card)"/>
    <rect x="10" y="10" width="580" height="110" rx="16" fill="none" stroke="#ff4444" stroke-width="2" stroke-dasharray="120 1000" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-1480" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="68" cy="65" r="32" fill="url(#num)"/>
    <text x="68" y="74" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">01</text>
    <text x="124" y="58" font-size="30" font-weight="800" fill="#ffffff">Ship small</text>
    <text x="124" y="94" font-size="19" fill="#9da7b3">Small releases beat big plans</text>

    <!-- card 2 -->
    <rect x="10" y="140" width="580" height="110" rx="16" fill="url(#card)"/>
    <rect x="10" y="140" width="580" height="110" rx="16" fill="none" stroke="#ff4444" stroke-width="2" stroke-dasharray="120 1000" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-1480" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="68" cy="195" r="32" fill="url(#num)"/>
    <text x="68" y="204" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">02</text>
    <text x="124" y="188" font-size="30" font-weight="800" fill="#ffffff">Care about UI</text>
    <text x="124" y="224" font-size="19" fill="#9da7b3">Spacing, type, and states matter</text>

    <!-- card 3 -->
    <rect x="10" y="270" width="580" height="110" rx="16" fill="url(#card)"/>
    <rect x="10" y="270" width="580" height="110" rx="16" fill="none" stroke="#ff4444" stroke-width="2" stroke-dasharray="120 1000" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-1480" dur="6s" begin="-4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="68" cy="325" r="32" fill="url(#num)"/>
    <text x="68" y="334" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">03</text>
    <text x="124" y="318" font-size="30" font-weight="800" fill="#ffffff">Stay readable</text>
    <text x="124" y="354" font-size="19" fill="#9da7b3">Code others can pick up fast</text>
  </g>
</svg>
