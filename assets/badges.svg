<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-label="Open to collaboration. Indonesia, UTC+7. Frontend, web apps." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1010"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="chipG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2415"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- chip 1: availability -->
    <rect x="60" y="8" width="480" height="58" rx="29" fill="url(#chipG)" stroke="#27c93f" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="60" y="8" width="480" height="58" rx="29" fill="none" stroke="#27c93f" stroke-width="3" stroke-dasharray="110 1000" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-1220" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="108" cy="37" r="9" fill="#27c93f"/>
    <circle cx="108" cy="37" r="9" fill="none" stroke="#27c93f" stroke-width="3">
      <animate attributeName="r" values="9;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="142" y="46" font-size="24" font-weight="800" fill="#27c93f" letter-spacing="1.5">OPEN TO COLLABORATION</text>

    <!-- chip 2: location -->
    <rect x="12" y="84" width="280" height="54" rx="27" fill="url(#chip)" stroke="#ff4444" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="12" y="84" width="280" height="54" rx="27" fill="none" stroke="#ff4444" stroke-width="3" stroke-dasharray="90 1000" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-700" dur="5s" begin="-1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="119" font-size="22" font-weight="700" fill="#ffffff"><tspan fill="#ff4444">◉</tspan>  Indonesia · UTC+7</text>

    <!-- chip 3: focus -->
    <rect x="308" y="84" width="280" height="54" rx="27" fill="url(#chip)" stroke="#ff4444" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="308" y="84" width="280" height="54" rx="27" fill="none" stroke="#ff4444" stroke-width="3" stroke-dasharray="90 1000" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-700" dur="5s" begin="-3s" repeatCount="indefinite"/>
    </rect>
    <text x="336" y="119" font-size="22" font-weight="700" fill="#ffffff"><tspan fill="#ff4444">◆</tspan>  Frontend · Web Apps</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
